<style>/* Eurekaïe ! — interface (thèmes clair / sombre) */
:root {
  --fond: #f4f1ea; --surface: #ffffff; --surface2: #ece7dc; --texte: #1d1b18; --doux: #6b6458; --bord: #d6cfbf;
  --accent: #b8862b; --accent-texte: #ffffff; --danger: #c0392b; --ok: #2f855a;
  --bio: #044F8B; --phys: #913089; --eco: #009882; --chim: #E83643;
  --ombre: 0 1px 3px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fond: #15171c; --surface: #1f232b; --surface2: #282d37; --texte: #ece8df; --doux: #a29a8c; --bord: #383e4a;
    --accent: #d9a441; --accent-texte: #15171c; --ombre: 0 1px 3px rgba(0,0,0,.5);
    --bio: #2f7fc4; --phys: #b558ad; --eco: #19b39b; --chim: #f05763;
  }
}
:root[data-theme="dark"] {
  --fond: #15171c; --surface: #1f232b; --surface2: #282d37; --texte: #ece8df; --doux: #a29a8c; --bord: #383e4a;
  --accent: #d9a441; --accent-texte: #15171c; --ombre: 0 1px 3px rgba(0,0,0,.5);
  --bio: #2f7fc4; --phys: #b558ad; --eco: #19b39b; --chim: #f05763;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fond); color: var(--texte); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
button { font: inherit; cursor: pointer; border: 1px solid var(--bord); background: var(--surface2); color: var(--texte); border-radius: 8px; padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.prim { background: var(--accent); color: var(--accent-texte); border-color: var(--accent); font-weight: 600; }
button.petit { padding: 2px 8px; font-size: 13px; }
input, select { font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--bord); background: var(--surface); color: var(--texte); }
h1, h2, h3 { margin: 0 0 8px; line-height: 1.2; }
h2 { font-size: 17px; } h3 { font-size: 15px; }
.doux { color: var(--doux); }
.app { max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; }

/* en-tête */
.entete { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.entete .titre { font-weight: 800; font-size: 20px; letter-spacing: .5px; }
.entete .infos { flex: 1; color: var(--doux); }
.entete .outils { display: flex; gap: 6px; }

.grille { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
@media (max-width: 980px) { .grille { grid-template-columns: minmax(0, 1fr); } }
.bloc { background: var(--surface); border: 1px solid var(--bord); border-radius: 12px; padding: 12px; box-shadow: var(--ombre); margin-bottom: 14px; }

/* domaines */
.d-bio { --d: var(--bio); } .d-phys { --d: var(--phys); } .d-eco { --d: var(--eco); } .d-chim { --d: var(--chim); }
.pastille { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--d); color: #fff; font-size: 12px; font-weight: 700; }
.hier { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.hier .rang { display: inline-flex; gap: 6px; align-items: center; background: var(--d); color: #fff; border-radius: 8px; padding: 4px 10px; font-weight: 600; }
.hier .rang small { opacity: .8; font-weight: 400; }

/* pistes */
.piste { display: grid; grid-template-columns: 96px repeat(8, minmax(0, 1fr)); gap: 3px; margin-bottom: 4px; align-items: stretch; }
.piste .nom { background: var(--d); color: #fff; border-radius: 6px; padding: 4px 8px; font-weight: 700; font-size: 13px; display: flex; align-items: center; }
.case { position: relative; min-height: 46px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--bord); padding: 2px; display: flex; flex-wrap: wrap; gap: 2px; align-content: flex-start; }
.case .num { position: absolute; right: 4px; bottom: 1px; font-size: 11px; color: var(--doux); }
.case.palier { border-color: var(--d); border-width: 2px; }
.case.sept { background: color-mix(in srgb, var(--d) 22%, var(--surface2)); }
.jeton-palier { width: 100%; font-size: 10px; line-height: 1.1; color: var(--doux); }
.jeton-palier.pris { text-decoration: line-through; }
.pion { width: 18px; height: 18px; border-radius: 50%; background: var(--pj); color: #111; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(0,0,0,.35); }

/* cartes */
.cartes { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.carte { border: 2px solid var(--d); border-radius: 10px; background: var(--surface); overflow: hidden; display: flex; flex-direction: column; font-size: 13px; text-align: left; padding: 0; color: var(--texte); }
.carte .haut { background: var(--d); color: #fff; padding: 4px 8px; display: flex; justify-content: space-between; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px; }
.carte.C .haut { background: var(--surface); color: var(--d); border-bottom: 2px dashed var(--d); }
.carte .nomc { font-weight: 700; padding: 6px 8px 2px; }
.carte .effet { padding: 0 8px 6px; flex: 1; color: var(--texte); }
.carte .bas { display: flex; gap: 4px; padding: 4px 8px 6px; align-items: center; flex-wrap: wrap; }
.carte .bas .niv { margin-left: auto; color: var(--d); }
button.carte:hover:not(:disabled) { outline: 2px solid var(--accent); }
.carte.choisie { outline: 3px solid var(--accent); }
.carte.verrou { opacity: .45; }
.carte.vide { border-style: dashed; border-color: var(--bord); color: var(--doux); padding: 10px; }
.sous { font-size: 12px; color: var(--doux); padding: 0 2px 2px; }

/* action */
.action { border: 2px solid var(--accent); }
.action .consigne { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.rangee { margin-bottom: 10px; }
.toast { background: var(--danger); color: #fff; padding: 6px 10px; border-radius: 8px; margin-bottom: 8px; }

/* joueurs */
.joueur { border-left: 6px solid var(--pj); }
.joueur .ligne { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.joueur .nomj { font-weight: 700; font-size: 16px; }
.joueur.actif { box-shadow: 0 0 0 2px var(--accent); }
.mini { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }
.mini span { font-size: 11px; border: 1px solid var(--d); border-radius: 6px; padding: 1px 6px; }
.mini span.C { border-style: dashed; }
.mini span.lock { opacity: .5; }
.obj { background: var(--surface2); border-radius: 8px; padding: 6px 8px; margin: 4px 0; font-size: 13px; }
.obj b { color: var(--accent); }
.jetons { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.jetons span { font-size: 11px; background: var(--surface2); border-radius: 6px; padding: 2px 6px; }
.jetons span.use { text-decoration: line-through; opacity: .6; }

.journal { max-height: 320px; overflow-y: auto; font-size: 13px; }
.journal div { padding: 2px 0; border-bottom: 1px solid var(--bord); }

/* écrans pleins */
.ecran { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
.ecran .boite { background: var(--surface); border: 1px solid var(--bord); border-radius: 16px; padding: 24px; max-width: 520px; width: 100%; box-shadow: var(--ombre); text-align: center; }
.ecran .boite h1 { font-size: 28px; }
.noms { display: grid; gap: 6px; margin: 12px 0; }
.voile { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
@media (max-width: 560px) {
  .piste { grid-template-columns: 58px repeat(8, minmax(0, 1fr)); gap: 2px; }
  .piste .nom { font-size: 11px; padding: 2px 4px; }
  .case { min-height: 40px; padding: 1px; }
  .jeton-palier { font-size: 8px; overflow: hidden; max-height: 18px; }
  .pion { width: 14px; height: 14px; font-size: 9px; }
  .entete .infos { flex-basis: 100%; order: 3; }
}

.pastille-ia { font-size: 11px; font-weight: 700; background: var(--accent); color: var(--accent-texte); border-radius: 6px; padding: 1px 6px; }
.ligne-nom { display: flex; gap: 6px; }
.ligne-nom input { flex: 1; min-width: 0; }

/* domaine censuré : bandeau, cases hachurées ; frise des censures */
.piste .nom { flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; }
.piste .nom small { font-weight: 400; font-size: 10px; opacity: .9; }
.bandeau { background: #111; color: #fff; font-size: 10px; letter-spacing: .6px; text-transform: uppercase; padding: 0 5px; border-radius: 4px; }
.piste.censuree .case { background-image: repeating-linear-gradient(-45deg, transparent 0 6px, color-mix(in srgb, var(--d) 30%, transparent) 6px 9px); border-color: var(--d); }
.piste.censuree .nom { box-shadow: 0 0 0 3px var(--texte); }
.piste.censuree.passee .case { background-image: repeating-linear-gradient(-45deg, transparent 0 8px, color-mix(in srgb, var(--d) 14%, transparent) 8px 10px); }
.piste.censuree.passee .nom { box-shadow: none; }
.frise { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: -4px 0 10px; font-size: 12px; }
.frise span[class^="d-"] { border: 1px solid var(--d); color: var(--texte); border-left: 6px solid var(--d); border-radius: 6px; padding: 1px 6px; }

/* statistiques */
.tableau { overflow-x: auto; }
.tableau table { border-collapse: collapse; width: 100%; font-size: 13px; }
.tableau th, .tableau td { border-bottom: 1px solid var(--bord); padding: 5px 8px; text-align: left; vertical-align: top; }
.tableau tr[data-a] { cursor: pointer; }
.tableau tr.sel td { background: var(--surface2); }
.tableau td.main { min-width: 260px; font-size: 12px; }
.partie { border-bottom: 1px solid var(--bord); padding: 8px 0; }
.partie .ligne { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.partie .detail { margin-top: 8px; }
.plan { width: 100%; max-width: 620px; height: auto; display: block; margin-bottom: 8px; border-radius: 6px; }
</style></head>

    "PHYS-2-4": { quand: "censure", run: S => { S.hier.reverse(); log(S, "Antimatière : hiérarchie inversée"); } },

    "ECO-2-4": verrouilleePerd,

        c.attendu = "cible"; return ask("joueur", cibles, "Sabotage : quel joueur défausse un objectif ?");

      t.objectifs = t.objectifs.filter(o => o.id !== c.obj); S.objDefausse.push(c.obj);

    "CHIM-3-1": { quand: "recherche", run: (S, c) => {

      if (c.choix.length) { gainVeille(S, c.p, -1); gainXP(S, c.p, c.choix[c.choix.length - 1], 1); }
      const o = DOMAINES.filter(d => j.xp[d] < MAX_PISTE);
      if (j.veille > 0 && o.length) return ask("domaine", o, `Convertissez vos Veilles (${j.veille} restantes) : piste ?`);

    // ---- Censures ajoutées le 08/11/2026 ----
    "BIO-1-6": { quand: "censure", run: () => {} }, // Contagion : appliquée au calcul des Veilles des joueurs censurés
    // Inoculation forcée : chaque autre joueur perd 1 XP dans sa piste la plus haute hors 7 ;
    // en cas d'égalité, c'est le joueur touché qui choisit la piste (Oni, 08/11/2026)
    "BIO-2-6": { quand: "censure", run: (S, c) => {
      const L = autres(S, c.p);

      while (c.i < L.length) {

        const m = P.length ? Math.max(...P.map(d => x[d])) : 0, hautes = P.filter(d => x[d] === m);
        if (hautes.length > 1) { c.touche = q; return { ...ask("domaine", hautes, `Inoculation forcée : ${nom(S, q)} choisit la piste qui perd 1 XP`), pour: q }; }
        if (hautes.length === 1) gainXP(S, q, hautes[0], -1, c.p);
        c.i++;
      }
    } },
    // Expropriation : voler un jeton de palier non utilisé (le voleur peut s'en servir à partir du tour suivant, À VALIDER)
    "BIO-3-4": { quand: "censure", run: (S, c) => {
      lire(c);
      const volables = q => S.joueurs[q].jetons.filter(t => !t.used);
      if (c.cible === undefined) {

        c.attendu = "cible"; return ask("joueur", L, "Expropriation : à quel joueur volez-vous un jeton ?");

      const t = S.joueurs[c.cible].jetons.find(x => x.k === c.jeton && !x.used);
      S.joueurs[c.cible].jetons = S.joueurs[c.cible].jetons.filter(x => x !== t);
      S.joueurs[c.p].jetons.push({ ...t, tour: S.tour });
      if (t.cle) S.paliers[t.cle] = c.p;
      log(S, `${nom(S, c.p)} vole le jeton « ${JETONS[t.cle] ? JETONS[t.cle].nom : t.k} » de ${nom(S, c.cible)}`);
    } },
    // Interception : regarder la prochaine carte d'une pile (en secret) et la placer sous la pile
    "PHYS-1-6": { quand: "censure", run: (S, c) => {

      const d = c.choix[0];
      if (c.choix.length === 1) return { ...ask("ouinon", [true], `Prochaine carte de ${D(d)} : « ${carte(S.piles[d][0]).nom} ». Elle part sous la pile.`), prive: true };
      S.piles[d].push(S.piles[d].shift());
      log(S, `${nom(S, c.p)} place la prochaine carte ${D(d)} sous la pile`);

    // Inversion des pôles : échanger sa gemme avec celle d'un joueur
    "PHYS-1-7": { quand: "censure", run: (S, c) => {

      const a = S.joueurs[c.p], b = S.joueurs[c.choix[0]];
      [a.gemme, b.gemme] = [b.gemme, a.gemme];

    // Gel des fonds : la carte visible du domaine censuré ne peut pas être acquise ce tour
    "ECO-2-6": { quand: "censure", run: S => { S.t.gel = S.t.censure; log(S, `Gel des fonds : la carte Progrès ${D(S.t.censure)} ne peut pas être acquise ce tour`); } },
    // Précipité : un joueur perd 1 Veille (même effet qu'Onde de Choc pour l'instant)
    "CHIM-1-6": { quand: "censure", run: (S, c) => {
      if (!c.choix.length) return ask("joueur", autres(S, c.p), "Un joueur perd 1 Veille");

    // jetons
    "J-regard": regard("jeton"),
    "J-veto": { quand: "veto", run: (S, c) => {
      if (!c.choix.length) {
        const o = autres(S, c.p).filter(q => !S.t.annules.includes(q));
        return ask("joueur", o, "Veto : annulez le vote de censure d'un adversaire (ou passez pour garder le jeton)", true);
      }
      if (c.choix[0] === null) return;
      useJeton(S, c.p, "veto"); S.t.annules.push(c.choix[0]);
      log(S, `${nom(S, c.p)} utilise son Veto : le vote de ${nom(S, c.choix[0])} est annulé`);
    } },
  };
  // Effets prévus pour l'étape 3 (effets « Tour suivant », cartes qui changent le déroulement du tour)
  const A_VENIR = ["BIO-3-3", "PHYS-1-5", "PHYS-2-2", "PHYS-2-3", "PHYS-3-1", "PHYS-3-2", "PHYS-3-3",
    "ECO-1-5", "ECO-2-3", "CHIM-2-3", "CHIM-2-4", "CHIM-3-2", "CHIM-3-3"];
  const programme = id => !!FX[id];

  // ---------- déroulement du tour ----------
  // 1. révélation : jetons annoncés, ordre de jeu, Vetos ; 2. décompte des votes (compterVotes) ; 3–4. résolution ; 5. acquisition
  function revelation(S) {
    const tous = S.joueurs.map((_, i) => i);
    S.t = { bloques: [], annules: [], vote2: [], immunes: [], normalFait: false, gel: null,
      jouees: tous.map(p => ({ r: carteJouee(S, p, "R"), c: carteJouee(S, p, "C") })) };
    for (const p of tous) for (const k of S.joueurs[p].prog.jetons || []) {
      useJeton(S, p, k);
      S.t[k === "vote2" ? "vote2" : "immunes"].push(p);
      log(S, `${nom(S, p)} révèle son jeton « ${k === "vote2" ? "Vote double" : "Immunité"} »`);
    }
    S.t.gemmes = tous.map(p => gemmeEff(S, p));
    S.ordre = calcOrdre(S, S.t.gemmes);
    echangerGemmes(S);
    const E = S.ordre.filter(p => jetonUtilisable(S, p, "veto")).map(p => ({ k: "fx", p, id: "J-veto", quand: "veto" }));
    E.push({ k: "vote" });
    S.etapes = E; S.phase = "resol";
    avancer(S);
  }

  function compterVotes(S) {
    const votes = { bio: 0, phys: 0, eco: 0, chim: 0 }, tous = S.joueurs.map((_, i) => i);
    // Mutation Cachée : vote double, quel que soit le résultat du vote (À VALIDER) ; jeton Vote double : ×2
    for (const p of tous) if (!S.t.annules.includes(p))
      votes[S.joueurs[p].prog.c] += (S.t.jouees[p].c === "BIO-1-5" ? 2 : 1) * (S.t.vote2.includes(p) ? 2 : 1);
    const max = Math.max(...Object.values(votes));
    const censure = DOMAINES.filter(d => votes[d] === max).sort((a, b) => S.hier.indexOf(b) - S.hier.indexOf(a))[0]; // égalité : le plus bas
    const haut = S.hier[0];
    log(S, `Tour ${S.tour} — votes : ${DOMAINES.map(d => D(d) + " " + votes[d]).join(", ")} → ${D(censure)} est censuré`);
    Object.assign(S.t, { votes, censure,
      actives: tous.filter(p => !S.t.annules.includes(p) && S.joueurs[p].prog.c === censure),
      censures: tous.filter(p => S.joueurs[p].prog.r === censure && !S.t.immunes.includes(p)) });
    for (const p of S.t.immunes) if (S.joueurs[p].prog.r === censure) log(S, `${nom(S, p)} est immunisé : sa Recherche n'est pas censurée`);
    // compteurs des objectifs liés au vote
    for (const p of tous) for (const o of S.joueurs[p].objectifs) {
      const active = S.t.actives.includes(p);
      if (o.id === "O-MARTYR") o.n = S.t.censures.includes(p) ? o.n + 1 : 0;
      if (o.id === "O-CENS2") o.n = active ? o.n + 1 : 0;
      if (o.id === "O-HAUT" && active && censure === haut) o.ok = true;
      if (o.id === "O-SEUL" && active && S.t.actives.length === 1) o.ok = true;
    }
    const E = [];
    const fx = (p, id, quand) => { const f = FX[id]; if (f && f.quand === quand) E.push({ k: "fx", p, id, quand }); else if (!f && A_VENIR.includes(id) && quand === (carte(id).type === "C" ? "censure" : "recherche")) E.push({ k: "avenir", p, id }); };
    // Phase 3 : effets des Censures ayant visé le domaine censuré, puis Veilles (Oni, 07/11/2026) :
    // +1 par Censure efficace (+1 de plus si le domaine censuré est à 7 chez un adversaire qui a un objectif : chasse au leader),
    // +2 par joueur censuré (3 si Lobby Vert est efficace). Veilles données après les effets des Censures (À VALIDER).
    for (const p of S.ordre) if (S.t.actives.includes(p)) fx(p, S.t.jouees[p].c, "censure");
    for (const p of S.ordre) if (S.t.actives.includes(p)) {
      const prime = autres(S, p).some(q => S.joueurs[q].objectifs.length && S.joueurs[q].xp[censure] >= MAX_PISTE);
      E.push({ k: "veille", p, n: prime ? 2 : 1, raison: prime ? "Censure efficace + chasse au leader" : "Censure efficace" });
    }
    const lobby = S.t.actives.some(p => S.t.jouees[p].c === "ECO-1-5"), contagion = S.t.actives.some(p => S.t.jouees[p].c === "BIO-1-6");
    const nV = (lobby ? 3 : 2) - (contagion ? 1 : 0);
    for (const p of S.ordre) if (S.t.censures.includes(p)) { E.push({ k: "veille", p, n: nV, raison: "Recherche censurée" + (lobby ? " (Lobby Vert)" : "") + (contagion ? " (Contagion)" : "") }); fx(p, S.t.jouees[p].r, "censure_r"); }
    // Phase 4 : Recherches non censurées (+1 XP de base, puis effet)
    for (const p of S.ordre) if (!S.t.censures.includes(p)) {
      const id = S.t.jouees[p].r;
      if (FX[id] && FX[id].quand === "base") fx(p, id, "base"); else E.push({ k: "xp", p });
      fx(p, id, "recherche");
    }
    E.push({ k: "acq" });
    S.etapes = E.concat(S.etapes);
  }

  function avancer(S) {
    verifier(S);
    while (!S.attente && S.gagnant === null && S.etapes.length) {
      const e = S.etapes.shift();
      if (e.k === "veille") avecCause(e.raison, () => gainVeille(S, e.p, e.n));
      else if (e.k === "xp") avecCause("Recherche", () => gainXP(S, e.p, S.joueurs[e.p].prog.r, 1));
      else if (e.k === "vote") compterVotes(S);
      else if (e.k === "avenir") log(S, `« ${carte(e.id).nom} » : effet pas encore programmé dans le prototype`);
      else if (e.k === "fx") { const ctx = { p: e.p, id: e.id, quand: e.quand, choix: [] }; poser(S, ctx, avecCause(`${nomSource(e.id)} de ${nom(S, e.p)}`, () => FX[e.id].run(S, ctx))); }
      else if (e.k === "acq") debutAcquisition(S);
      verifier(S);
    }
  }
  function poser(S, ctx, demande) {
    if (!demande || (!demande.options.length && !demande.passer)) { S.attente = null; return; }
    S.attente = { p: demande.pour !== undefined ? demande.pour : ctx.p, ctx, demande };
  }

  function debutAcquisition(S) {
    S.phase = "acq";
    S.ordre = calcOrdre(S, S.t.gemmes); // recalculé : la hiérarchie a pu changer (Antimatière) (À VALIDER)
    S.acq = -1; suivantAcq(S);
  }
  function suivantAcq(S) {
    S.t.normalFait = false;
    do S.acq++; while (S.acq < S.ordre.length && S.t.bloques.includes(S.ordre[S.acq]));
    if (S.acq >= S.ordre.length) finTour(S);
  }
  function finTour(S) {
    for (const j of S.joueurs) { j.verrou = ["R-" + j.prog.r, "C-" + j.prog.c]; j.prog = null; }
    enHaut(S, S.t.censure);
    (S.histo = S.histo || []).push({ tour: S.tour, dom: S.t.censure, votes: S.t.votes }); // historique des censures (affichage)
    S.dernier = S.t; S.t = null; S.tour++; S.phase = "prog"; S.ordre = [];
  }

  // ---------- point d'entrée unique des actions ----------
  // Renvoie "" si l'action est appliquée, sinon la raison du refus.
  const ANNONCES = ["vote2", "immunite"]; // jetons annoncés face cachée avec la programmation
  const ACTIONS = {
    programmer(S, p, { r, c, jetons = [] } = {}) {
      if (S.phase !== "prog") return "Ce n'est pas la phase de programmation";
      const j = S.joueurs[p];
      if (j.prog) return "Vous avez déjà programmé vos cartes";
      if (!DOMAINES.includes(r) || !DOMAINES.includes(c)) return "Choisissez une Recherche et une Censure";
      if (j.verrou.includes("R-" + r)) return "Cette Recherche est verrouillée ce tour";
      if (j.verrou.includes("C-" + c)) return "Cette Censure est verrouillée ce tour";
      if (!Array.isArray(jetons) || jetons.some(k => !ANNONCES.includes(k) || !jetonUtilisable(S, p, k)) || new Set(jetons).size !== jetons.length)
        return "Jeton non disponible";
      j.prog = { r, c, jetons };
      if (S.joueurs.every(x => x.prog)) revelation(S);
      return "";
    },
    annuler(S, p) {
      if (S.phase !== "prog" || !S.joueurs[p].prog) return "Rien à annuler";
      S.joueurs[p].prog = null; return "";
    },
    choisir(S, p, { v } = {}) {
      const a = S.attente;
      if (!a || a.p !== p) return "Aucun choix attendu de votre part";
      if (v === null || v === undefined) { if (!a.demande.passer) return "Un choix est obligatoire"; v = null; }
      else if (!a.demande.options.includes(v)) return "Choix impossible";
      a.ctx.choix.push(v);
      S.attente = null;
      poser(S, a.ctx, avecCause(`${nomSource(a.ctx.id)} de ${nom(S, a.ctx.p)}`, () => FX[a.ctx.id].run(S, a.ctx)));
      avancer(S);
      return "";
    },
    convertir(S, p, { dom } = {}) {
      const j = S.joueurs[p], cout = jetonUtilisable(S, p, "conversion") ? 2 : 3;
      if (j.veille < cout) return `Il faut ${cout} Veilles`;
      if (!DOMAINES.includes(dom) || j.xp[dom] >= MAX_PISTE) return "Piste invalide ou pleine";
      avecCause(`conversion de ${cout} Veilles`, () => { gainVeille(S, p, -cout); gainXP(S, p, dom, 1); });
      return "";
    },
    // jeton à usage libre (Regard vers l'avenir)
    jeton(S, p, { k } = {}) {
      if (k !== "regard") return "Ce jeton ne s'utilise pas ainsi";
      if (S.attente) return "Un choix est en cours";
      if (!jetonUtilisable(S, p, "regard")) return "Jeton non disponible";
      const ctx = { p, id: "J-regard", quand: "jeton", choix: [] };
      poser(S, ctx, FX["J-regard"].run(S, ctx));
      return "";
    },
    // acquisition normale (il faut atteindre le coût) ou, avec le jeton Progrès gratuit, une acquisition en plus sans condition de coût
    acquerir(S, p, { dom, gratuit = false } = {}) {
      if (S.phase !== "acq" || S.ordre[S.acq] !== p) return "Ce n'est pas votre tour d'acquérir";
      if (S.attente) return "Un choix est en cours";
      const id = S.visibles[dom];
      if (!id) return "Aucune carte visible dans ce domaine";
      if (S.t.gel === dom) return "Gel des fonds : cette carte ne peut pas être acquise ce tour";
      const k = carte(id), j = S.joueurs[p];
      if (gratuit) { if (!jetonUtilisable(S, p, "achat2")) return "Jeton Progrès gratuit non disponible"; }

      <div class="options" style="justify-content:center"><button class="prim" data-a="nouvelle">Nouvelle partie</button>
      ${sauve && sauve.gagnant === null ? `<button data-a="reprendre">Reprendre la partie (tour ${sauve.tour})</button>` : ""}</div>
      <div class="options" style="justify-content:center"><button class="petit" data-a="stats">Statistiques (${lireStats().length})</button></div></div></div>`;
  }
  function passage(p) {
    const pourquoi = S.attente ? "fait un choix secret" : "programme ses cartes";
    return `<div class="ecran"><div class="boite"><h1>${pion(p)} ${nomJ(p)}</h1><p>Passez l'appareil à <b>${nomJ(p)}</b>, qui ${pourquoi}.</p>
      <p class="doux">Les autres joueurs ne regardent pas l'écran.</p><button class="prim" data-a="voir" data-d="${p}">Je suis ${nomJ(p)}, afficher</button></div></div>`;
  }
  function jeu() {
    const ph = { prog: "programmation secrète", resol: "résolution", acq: "acquisition", fin: "partie terminée" }[S.phase];
    let h = `<div class="entete"><span class="titre">Eurekaïe !</span><span class="infos">Tour ${S.tour} · ${ph}</span>
      <span class="outils"><button class="petit" data-a="theme">Thème</button><button class="petit" data-a="menu">Menu</button></span></div>
      <div class="grille"><div>${action()}
      <div class="bloc"><h2>Plateau</h2>${hierarchie()}${pistes()}<p class="doux" style="margin:6px 0 0">Cases encadrées : jetons de palier (le premier joueur qui atteint la case le prend). Case 7 : on pioche un objectif.</p></div>
      <div class="bloc"><h2>Cartes Progrès disponibles</h2>${marche()}</div></div>
      <div>${S.joueurs.map((_, p) => joueurHTML(p)).join("")}
      <div class="bloc"><h2>Journal</h2><div class="journal">${S.log.slice(-60).reverse().map(l => `<div><span class="doux">T${l.tour}</span> ${esc(l.txt)}</div>`).join("")}</div></div></div></div>`;
    if (S.gagnant !== null) h += `<div class="voile"><div class="ecran" style="min-height:0"><div class="boite"><h1>${pion(S.gagnant)} ${nomJ(S.gagnant)} gagne !</h1>
      <p>${esc((S.log.slice().reverse().find(l => /gagne/.test(l.txt)) || { txt: "" }).txt)}</p><div class="options" style="justify-content:center"><button data-a="fermer">Voir le plateau</button><button data-a="stats" data-d="bilan">Bilan de la partie</button><button class="prim" data-a="menu">Nouvelle partie</button></div></div></div></div>`;
    return h;
  }
  function render() {
    const app = document.getElementById("app");
    enregistrer();
    if (ui.page === "stats") { app.innerHTML = `<div class="app">${pageStats()}</div>`; return; }
    if (!S) { app.innerHTML = `<div class="app">${accueil()}</div>`; return; }
    const sp = secretPour();
    if (sp !== null && ui.voit !== sp) { app.innerHTML = `<div class="app">${passage(sp)}</div>`; return; }
    app.innerHTML = `<div class="app">${jeu()}</div>`;
    if (ui.ferme) { const v = app.querySelector(".voile"); if (v) v.remove(); }
    tourIA();
  }

  // ---------- actions ----------
  function jouer(p, type, args) {
    const r = E.apply(S, p, type, args);
    ui.msg = r || "";
    return !r;
  }
  function handle(a, d) {
    ui.msg = "";
    if (a === "nbj") ui.nbj = +d;
    else if (a === "basculeIA") ui.ia[+d] = !ui.ia[+d];
    else if (a === "vitesse") ui.vitesse = +d;
    else if (a === "nouvelle") {
      const noms = []; for (let i = 0; i < ui.nbj; i++) noms.push((ui.noms[i] || "").trim() || (ui.ia[i] ? "IA " : "Joueur ") + (i + 1));
      S = E.newGame({ noms }); S.joueurs.forEach((j, i) => { j.ia = ui.ia[i]; }); ui.voit = null; ui.ferme = false;
    }
    else if (a === "reprendre") { S = charger(); ui.voit = null; }
    else if (a === "menu") { if (!S || S.gagnant !== null || confirm("Quitter la partie en cours ? Elle reste sauvegardée et pourra être reprise.")) { S = null; clearTimeout(ui.minuteur); ui.minuteur = null; } }
    else if (a === "theme") {
      const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = t; stocker(CLE_THEME, t);
    }
    else if (a === "fermer") ui.ferme = true;
    else if (a === "stats") { ui.page = "stats"; ui.statsOuvert = d === "bilan" && S ? S.enregistre : null; }
    else if (a === "statsRetour") ui.page = null;
    else if (a === "statsVer") ui.statsVer = d || null;
    else if (a === "statsIA") ui.statsIA = !ui.statsIA;
    else if (a === "statsDetail") ui.statsOuvert = ui.statsOuvert === d ? null : d;
    else if (a === "statsEffacer") { if (confirm("Effacer toutes les statistiques enregistrées dans ce navigateur ?")) stocker(CLE_STATS, "[]"); }
    else if (a === "statsCsv") {
      const url = URL.createObjectURL(new Blob(["\ufeff" + BILAN.csv(lireStats().map(x => x.r))], { type: "text/csv;charset=utf-8" }));
      const l = document.createElement("a"); l.href = url; l.download = "eurekaie-statistiques.csv"; l.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    else if (a === "voir") ui.voit = +d;
    else if (a === "selR") ui.sel.r = d;
    else if (a === "selC") ui.sel.c = d;
    else if (a === "jet") ui.sel.jetons = ui.sel.jetons.includes(d) ? ui.sel.jetons.filter(k => k !== d) : ui.sel.jetons.concat([d]);
    else if (a === "valider") {
      if (jouer(ui.voit, "programmer", { r: ui.sel.r, c: ui.sel.c, jetons: ui.sel.jetons })) { ui.sel = { r: null, c: null, jetons: [] }; ui.voit = null; }
    }
    else if (a === "choix") {
      const prive = S.attente && S.attente.demande.prive;
      if (jouer(S.attente.p, "choisir", { v: JSON.parse(d) }) && prive) ui.voit = null;
    }
    else if (a === "acq") jouer(S.ordre[S.acq], "acquerir", { dom: d });
    else if (a === "acqGratuit") jouer(S.ordre[S.acq], "acquerir", { dom: d, gratuit: true });
    else if (a === "passerAcq") jouer(S.ordre[S.acq], "passer");
    else if (a === "conv") ui.conv = +d >= 0 ? +d : null;
    else if (a === "convDom") { const [p, dom] = d.split(":"); if (jouer(+p, "convertir", { dom })) ui.conv = null; }
    else if (a === "regard") { if (jouer(+d, "jeton", { k: "regard" })) ui.voit = +d; }
    if (S) sauver();
    render();
  }
  function start() {
    document.addEventListener("click", e => {
      const t = e.target.closest("[data-a]");
      if (!t || t.disabled) return;
      handle(t.dataset.a, t.dataset.d);
    });
    document.addEventListener("input", e => { if (e.target.dataset.nom !== undefined) ui.noms[+e.target.dataset.nom] = e.target.value; });
    render();
  }
  return { start, handle, etat: () => S };
})();
if (typeof document !== "undefined") UI.start();
</script></body></html>
